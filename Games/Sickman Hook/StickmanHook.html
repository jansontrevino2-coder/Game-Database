@keyframes spin {
  from {
    transform: rotate(0deg);
  }
  to {
    transform: rotate(360deg);
  }
}

@keyframes fadeIn {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}

body {
  font-family: JUNEGULL;
}

.odin-font-loader {
  font-family: Odin;
  opacity: 0;
}

button,
input[type="button"],
.clickable {
  outline: none;
  pointer-events: all;
  -webkit-touch-callout: none;
  -webkit-user-select: none;

  -webkit-tap-highlight-color: transparent;
}

  top: 0;
  left: 0;
  right: 0;
  bottom: 0;

  height: 80px;

  color: white;
  font-size: 18px;
  display: inline-block;
  margin: 5px;
}

  height: 100px;

}

}

.level-progressbar {
  height: 100%;
  background-color: #ffffff;
}

.level-progress .lvl {
  width: 50px;
  display: inline-block;
  color: white;
  font-weight: bold;
}

.level-progress .lvl.current {
  text-align: right;
  padding-right: 10px;
}

.level-progress .lvl.next {

  padding-left: 10px;
}
